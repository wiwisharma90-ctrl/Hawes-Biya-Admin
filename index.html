<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f5">
  <meta name="description" content="لوحة إدارة منصة Haws Biya للسفر">
  <title>Haws Biya | لوحة الإدارة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="login-screen" id="login-screen">
    <section class="login-panel">
      <form class="login-form" id="login-form">
        <div class="login-mobile-brand brand">
          <span class="brand-mark" aria-hidden="true">H</span>
          <span><strong>Haws Biya</strong><small>Admin Panel</small></span>
        </div>
        <label for="security-code">Security Code</label>
        <input id="security-code" name="security-code" type="password" autocomplete="current-password" required aria-describedby="security-error">
        <p class="login-error is-hidden" id="security-error" role="alert"></p>
        <button class="button button-primary login-submit" type="submit">دخول إلى لوحة التحكم <span aria-hidden="true">←</span></button>
      </form>
    </section>
  </div>

  <div class="app-shell is-hidden" id="app-shell">
    <div class="sidebar-scrim" id="sidebar-scrim"></div>
    <aside class="sidebar" id="sidebar">
      <a class="brand sidebar-brand" href="#" data-page="dashboard" aria-label="Haws Biya لوحة التحكم">
        <span class="brand-mark" aria-hidden="true">H</span>
        <span><strong>Haws Biya</strong><small>Admin Panel</small></span>
      </a>
      <div class="sidebar-label">القائمة الرئيسية</div>
      <nav class="nav-list" aria-label="القائمة الرئيسية">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">◫</span><span>لوحة التحكم</span></button>
        <button class="nav-item" data-page="users"><span class="nav-icon">♙</span><span>المستخدمون</span></button>
        <button class="nav-item" data-page="hosts"><span class="nav-icon">♧</span><span>المنظمون</span></button>
        <button class="nav-item" data-page="programs"><span class="nav-icon">⌖</span><span>البرامج</span></button>
        <button class="nav-item" data-page="bookings"><span class="nav-icon">▤</span><span>الحجوزات</span></button>
        <button class="nav-item" data-page="complaints"><span class="nav-icon">⚑</span><span>الشكاوى</span></button>
        <button class="nav-item" data-page="notifications"><span class="nav-icon">♧</span><span>الإشعارات</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="admin-profile">
          <div class="avatar avatar-admin">Z</div>
          <div class="profile-copy"><strong>المسؤول</strong><small>مدير النظام</small></div>
          <button class="icon-button profile-menu" type="button" aria-label="خيارات الحساب">⋯</button>
        </div>
        <button class="logout-button" type="button" id="logout-button"><span class="nav-icon">↪</span> تسجيل الخروج</button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-start">
          <button class="icon-button menu-button" id="menu-button" type="button" aria-label="فتح القائمة">☰</button>
          <div class="breadcrumb"><span>الرئيسية</span><span class="breadcrumb-slash">/</span><strong id="breadcrumb-current">لوحة التحكم</strong></div>
        </div>
        <div class="topbar-actions">
          <span class="today-date" id="today-date"></span>
          <button class="icon-button notification-button" data-page="notifications" type="button" aria-label="الإشعارات">♧</button>
          <div class="topbar-divider"></div>
          <div class="topbar-user"><span class="topbar-user-copy"><strong>المسؤول</strong><small>مدير النظام</small></span><div class="avatar avatar-small">Z</div></div>
        </div>
      </header>
      <section class="page-content" id="page-content" aria-live="polite"></section>
      <footer class="app-footer"><span>© 2026 ws programing</span><span>صُنع بعناية لتجارب أجمل </span></footer>
    </main>
  </div>

  <div class="modal-backdrop is-hidden" id="modal-backdrop" role="presentation">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <button class="icon-button modal-close" type="button" data-close-modal aria-label="إغلاق">×</button>
      <div id="modal-content"></div>
    </section>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
